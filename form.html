<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<form>, initial-scale=1.0">
    <title> Student Registration Form</title>
</head>
<body>
    <form action="#" method ="post">
        <fieldset>
        <h1> Student Registration Form</h1><br><br>
        <label for= "name" >Full Name: </label>
        <input type="text"name="name" id="name" required> <br><br>
         <label for= "email" >Email: </label>
        <input type="email"name="email" id="email" required> <br><br>
         <label for= "pass" >Password: </label>
        <input type="password"name="password" id="pass" required> <br><br>
         <label for= "age" >Age: </label>
        <input type="age"name="age" id="age" required> <br><br>
          <label for= "dob" >Date of Birth: </label>
        <input type="date"name="dob" id="dob" required> <br><br>
Gender:
<input type ="radio" name="Gender" value="Male">Male
<input type ="radio" name="Gender" value="Female">Female
<br><br>

<label for="city">Choose a city:</label>

<select name="city" id="city">
  <option value="Dhaka">Dhaka</option>
  <option value="Khulna">Khulna</option>
  <option value="Shylet">Shylet</option>
  <option value="Rajshahi">Rajshahi</option>
</select>
 <br><br>

Hobbies:<br>
<input type ="checkbox" name="Hobbies" value=" Reading">Reading
<input type ="checkbox" name="Hobbies" value="Cricket">Cricket
<input type ="checkbox" name="Hobbies" value="Music">Music
<br><br>

<label for="About yourself">About yourself:</label>

<textarea id="About yourself" name="About yourself" rows="2" cols="50">
</textarea>
<br><br>

<button>Submit</button>
<button>Reset</button>

</fieldset>




     </form>
</body>
</html>
